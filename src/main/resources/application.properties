spring.application.name=comercioeletronico

# Conexao com PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/comercioeletronico
spring.datasource.username=comercioeletronico
spring.datasource.password=${DB_PASSWORD}

#Configura�oes JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Configuracao do Flyway para um banco existente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

