info:
  name: Paginar Produtos
  type: http
  seq: 20

http:
  method: GET
  url: http://localhost:8080/produtos?page=1&size=5
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
