info:
  name: Filtrar produtos por categoria
  type: http
  seq: 22

http:
  method: GET
  url: http://localhost:8080/produtos?categoriaId=99999&page=0&size=5
  params:
    - name: categoriaId
      value: "99999"
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
